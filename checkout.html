<!DOCTYPE html>
<html>
<head>
  <title>Checkout — Chronos</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap');

    :root {
      --bg-primary: #fafaf9;
      --bg-secondary: #ffffff;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --border: #e7e5e4;
      --accent: #b8860b;
      --accent-dark: #92660d;
      --success: #10b981;
      --error: #dc2626;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-primary: #0f0f0e;
        --bg-secondary: #1a1a19;
        --text-primary: #fafaf9;
        --text-secondary: #a8a8a8;
        --border: #3a3a38;
        --accent: #d4af37;
        --accent-dark: #e8c547;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 40px;
      text-align: center;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      margin-bottom: 8px;
    }

    p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .cart-section {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 32px;
    }

    .cart-title {
      font-weight: 600;
      margin-bottom: 16px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      padding-top: 16px;
      margin-top: 16px;
      border-top: 2px solid var(--border);
      font-weight: 600;
      font-size: 18px;
    }

    .cart-empty {
      text-align: center;
      color: var(--text-secondary);
      padding: 40px 0;
    }

    .form-section {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
    }

    .form-title {
      font-weight: 600;
      margin-bottom: 16px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input[type="email"],
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: inherit;
    }

    input[type="email"]:focus,
    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    #card-element {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-primary);
    }

    .StripeElement {
      box-sizing: border-box;
      height: 40px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background-color: var(--bg-primary);
      box-shadow: 0 1px 3px 0 #e6ebf1;
      -webkit-transition: box-shadow 150ms ease;
      transition: box-shadow 150ms ease;
    }

    .StripeElement--focus {
      box-shadow: 0 1px 3px 0 #cfd7df;
      border-color: var(--accent);
    }

    .StripeElement--invalid {
      border-color: var(--error);
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.2s ease;
    }

    button:hover:not(:disabled) {
      background: var(--accent-dark);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 14px;
    }

    .error-message {
      background: #fee2e2;
      color: var(--error);
      border: 1px solid #fecaca;
    }

    .success-message {
      background: #dcfce7;
      color: var(--success);
      border: 1px solid #bbf7d0;
    }

    .back-link {
      text-align: center;
      margin-top: 24px;
    }

    .back-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⌚ Checkout</h1>
      <p>Complete your purchase securely with Stripe</p>
    </header>

    <div class="cart-section" id="cart-container">
      <div class="cart-title">Order Summary</div>
      <div id="cart-items"></div>
      <div class="cart-total">
        <span>Total</span>
        <span>$<span id="total">0</span></span>
      </div>
    </div>

    <form id="payment-form" class="form-section">
      <div class="form-title">Billing Information</div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required placeholder="John Doe">
      </div>

      <div class="form-title" style="margin-top: 24px;">Card Details</div>
      <div class="form-group">
        <div id="card-element"></div>
      </div>

      <button type="submit" id="submit-btn">Pay Now</button>

      <div id="error-message" class="message error-message" style="display: none;"></div>
      <div id="success-message" class="message success-message" style="display: none;"></div>
    </form>

    <div class="back-link">
      <a href="store.html">← Back to Store</a>
    </div>
  </div>

  <script>
    // ⚠️ Replace with your actual Stripe Publishable Key
    const STRIPE_PUBLISHABLE_KEY = 'pk_test_YOUR_PUBLISHABLE_KEY';

    if (!STRIPE_PUBLISHABLE_KEY || STRIPE_PUBLISHABLE_KEY.includes('YOUR_')) {
      document.getElementById('error-message').style.display = 'block';
      document.getElementById('error-message').textContent = 'Stripe key not configured. Contact store admin.';
      document.getElementById('submit-btn').disabled = true;
    }

    const stripe = Stripe(STRIPE_PUBLISHABLE_KEY);
    const elements = stripe.elements();
    const cardElement = elements.create('card');
    cardElement.mount('#card-element');

    // Load cart from localStorage
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const cartContainer = document.getElementById('cart-items');
    let total = 0;

    if (cart.length === 0) {
      document.getElementById('cart-container').innerHTML = '<div class="cart-empty">Your cart is empty. <a href="store.html">Continue shopping</a></div>';
    } else {
      cartContainer.innerHTML = cart.map(item => {
        const price = parseInt(item.price) || 0;
        total += price;
        return `<div class="cart-item">
          <span>${item.name}</span>
          <span>$${price}</span>
        </div>`;
      }).join('');
    }

    document.getElementById('total').textContent = total.toLocaleString();

    // Handle card errors
    cardElement.addEventListener('change', event => {
      const displayError = document.getElementById('error-message');
      if (event.error) {
        displayError.textContent = event.error.message;
        displayError.style.display = 'block';
      } else {
        displayError.style.display = 'none';
      }
    });

    // Handle form submission
    document.getElementById('payment-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const name = document.getElementById('name').value;
      const btn = document.getElementById('submit-btn');
      const errorMsg = document.getElementById('error-message');
      const successMsg = document.getElementById('success-message');

      btn.disabled = true;
      btn.textContent = 'Processing...';
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';

      try {
        // Create payment method with Stripe
        const { paymentMethod, error } = await stripe.createPaymentMethod({
          type: 'card',
          card: cardElement,
          billing_details: {
            name,
            email
          }
        });

        if (error) {
          errorMsg.textContent = error.message;
          errorMsg.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Pay Now';
          return;
        }

        // Send to your backend for processing
        // For demo, we'll simulate success
        // In production, send to: /api/charge or your payment endpoint

        // DEMO MODE - show success
        successMsg.textContent = '✓ Payment successful! Your order #' + Math.random().toString(36).substr(2, 9).toUpperCase() + ' is confirmed.';
        successMsg.style.display = 'block';

        localStorage.removeItem('cart');

        setTimeout(() => {
          window.location.href = 'store.html';
        }, 3000);

      } catch (err) {
        errorMsg.textContent = 'Payment error: ' + err.message;
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Pay Now';
      }
    });
  </script>
</body>
</html>
