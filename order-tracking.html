<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Tracking — IndoSwiss</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg-primary: #f9f7f4;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f5f3f1;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --text-tertiary: #999999;
      --border: #e8e6e4;
      --accent: #b8860b;
      --accent-dark: #92660d;
      --success: #10b981;
      --warning: #f59e0b;
      --info: #3b82f6;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-primary: #0f0e0d;
        --bg-secondary: #1a1a19;
        --bg-tertiary: #2a2a28;
        --text-primary: #fafaf9;
        --text-secondary: #a8a8a8;
        --text-tertiary: #777777;
        --border: #3a3a38;
        --accent: #d4af37;
        --accent-dark: #e8c547;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .search-box {
      margin-bottom: 32px;
      display: flex;
      gap: 12px;
    }

    .search-box input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 14px;
    }

    .search-box button {
      padding: 12px 24px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .search-box button:hover {
      background: var(--accent-dark);
    }

    .order-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .order-id {
      font-weight: 600;
      font-size: 16px;
    }

    .order-date {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .order-status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .status-processing {
      background: #dbeafe;
      color: #1e40af;
    }

    .status-shipped {
      background: #dcfce7;
      color: #166534;
    }

    .status-delivered {
      background: #d1fae5;
      color: #065f46;
    }

    .timeline {
      margin: 24px 0;
    }

    .timeline-item {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      position: relative;
      padding-left: 0;
    }

    .timeline-item:not(:last-child)::before {
      content: '';
      position: absolute;
      left: 16px;
      top: 32px;
      width: 2px;
      height: calc(100% + 16px);
      background: var(--border);
    }

    .timeline-dot {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--bg-tertiary);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .timeline-item.completed .timeline-dot {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }

    .timeline-item.active .timeline-dot {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(184, 134, 11, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(184, 134, 11, 0); }
    }

    .timeline-content {
      flex: 1;
      padding-top: 4px;
    }

    .timeline-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .timeline-desc {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .order-items {
      background: var(--bg-tertiary);
      border-radius: 6px;
      padding: 16px;
      margin-top: 16px;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 14px;
    }

    .item-row:not(:last-child) {
      border-bottom: 1px solid var(--border);
    }

    .item-name {
      color: var(--text-primary);
    }

    .item-price {
      color: var(--text-secondary);
    }

    .total-row {
      font-weight: 600;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }

    .no-orders {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }

    .live-update {
      background: #dbeafe;
      border: 1px solid #93c5fd;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 13px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3b82f6;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">INDOSWISS</div>
      <h1>Track Your Order</h1>
      <p class="subtitle">Get real-time updates on your watch delivery</p>
    </header>

    <div class="search-box">
      <input type="text" id="orderSearch" placeholder="Enter your Order ID (e.g., ORD-001)">
      <button onclick="searchOrder()">Search</button>
    </div>

    <div id="ordersContainer"></div>
  </div>

  <script>
    function getOrderStatus(orderDate) {
      const now = new Date();
      const order = new Date(orderDate);
      const hoursDiff = (now - order) / (1000 * 60 * 60);

      if (hoursDiff < 1) return 'pending';
      if (hoursDiff < 2) return 'processing';
      if (hoursDiff < 4) return 'shipped';
      return 'delivered';
    }

    function formatDate(date) {
      return new Date(date).toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function renderOrders(orders = null) {
      const container = document.getElementById('ordersContainer');
      let orderList = orders;

      if (!orderList) {
        const searchTerm = document.getElementById('orderSearch').value.toLowerCase();
        let allOrders = JSON.parse(localStorage.getItem('orders')) || [];
        orderList = searchTerm
          ? allOrders.filter(o => o.id.toLowerCase().includes(searchTerm))
          : allOrders;
      }

      if (orderList.length === 0) {
        container.innerHTML = '<div class="no-orders">No orders found. Start shopping!</div>';
        return;
      }

      container.innerHTML = orderList.map(order => {
        const status = getOrderStatus(order.date);
        const statusLabels = {
          pending: '⏳ Pending',
          processing: '⚙️ Processing',
          shipped: '📦 Shipped',
          delivered: '✓ Delivered'
        };

        return `
          <div class="order-card">
            ${status !== 'delivered' ? '<div class="live-update"><span class="live-dot"></span>Live updates enabled</div>' : ''}

            <div class="order-header">
              <div>
                <div class="order-id">${order.id}</div>
                <div class="order-date">${formatDate(order.date)}</div>
              </div>
              <span class="order-status status-${status}">${statusLabels[status]}</span>
            </div>

            <div class="timeline">
              <div class="timeline-item ${status === 'delivered' || status === 'shipped' || status === 'processing' ? 'completed' : ''} ${status === 'pending' ? 'active' : ''}">
                <div class="timeline-dot">📋</div>
                <div class="timeline-content">
                  <div class="timeline-title">Order Confirmed</div>
                  <div class="timeline-desc">Your order has been received and confirmed</div>
                </div>
              </div>

              <div class="timeline-item ${status === 'delivered' || status === 'shipped' || status === 'processing' ? 'completed' : ''} ${status === 'processing' ? 'active' : ''}">
                <div class="timeline-dot">⚙️</div>
                <div class="timeline-content">
                  <div class="timeline-title">Processing</div>
                  <div class="timeline-desc">We're preparing your watch for shipment</div>
                </div>
              </div>

              <div class="timeline-item ${status === 'delivered' || status === 'shipped' ? 'completed' : ''} ${status === 'shipped' ? 'active' : ''}">
                <div class="timeline-dot">📦</div>
                <div class="timeline-content">
                  <div class="timeline-title">Shipped</div>
                  <div class="timeline-desc">Your order is on the way to you</div>
                </div>
              </div>

              <div class="timeline-item ${status === 'delivered' ? 'completed' : ''} ${status === 'delivered' ? 'active' : ''}">
                <div class="timeline-dot">✓</div>
                <div class="timeline-content">
                  <div class="timeline-title">Delivered</div>
                  <div class="timeline-desc">Your watch has been delivered. Enjoy!</div>
                </div>
              </div>
            </div>

            <div class="order-items">
              ${order.items.map(item => `
                <div class="item-row">
                  <span class="item-name">${item.name} × ${item.qty}</span>
                  <span class="item-price">$${(item.price * item.qty).toLocaleString()}</span>
                </div>
              `).join('')}
              <div class="total-row">
                <span>Total:</span>
                <span>$${order.total.toLocaleString()}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // Auto-refresh every 30 seconds
      setTimeout(() => {
        if (document.querySelector('.order-card')) {
          renderOrders(orderList);
        }
      }, 30000);
    }

    function searchOrder() {
      renderOrders();
    }

    // Initial render
    renderOrders();

    // Listen for localStorage changes (real-time sync)
    window.addEventListener('storage', () => {
      renderOrders();
    });
  </script>
</body>
</html>
